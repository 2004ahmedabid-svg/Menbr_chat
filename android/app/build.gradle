plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.menbr_chat"
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.example.menbr_chat"
        minSdkVersion 23  // مهم عشان Firebase
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
}
